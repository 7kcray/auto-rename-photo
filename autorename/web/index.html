<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截图批量重命名</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-hover: #1c212a;
    --line: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #4c8dff;
    --danger: #ff5c5c;
    --ok: #4ec9a0;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 22px 28px 0;
  }

  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .2px; }

  .subtitle { color: var(--muted); font-size: 12px; }

  .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .count b { color: var(--text); font-size: 15px; }
  .count .warn { color: var(--danger); }
  .count .ok { color: var(--ok); }

  .pathbar, .targetbar {
    display: flex;
    gap: 10px;
    padding: 16px 28px 0;
  }

  .targetbar { padding-top: 10px; }

  .pathbar input, .targetbar input {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
  }

  .pathbar input:focus, .targetbar input:focus { border-color: var(--accent); }
  .pathbar input::placeholder, .targetbar input::placeholder { color: #5d6474; }

  button {
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    padding: 10px 18px;
  }

  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }

  button.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
  }

  button.ghost:hover { border-color: #3a4250; color: var(--text); filter: none; }

  .status {
    padding: 10px 28px 0;
    min-height: 22px;
    color: var(--muted);
    font-size: 13px;
  }

  .status.error { color: var(--danger); }
  .status.warn { color: #e0a44c; }
  .status.done { color: var(--ok); }

  .hint {
    padding: 8px 28px 0;
    color: #6b7386;
    font-size: 12px;
  }

  .hint code {
    font-family: var(--mono);
    color: var(--muted);
  }

  main { padding: 6px 28px 40px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card:hover { border-color: #3a4250; }

  .card.invalid { border-color: rgba(255, 92, 92, .5); }
  .card.pending { border-color: rgba(255, 92, 92, .45); }
  .card.ready { border-color: rgba(78, 201, 160, .45); }

  .thumb {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0b0d11;
    border: 0;
    border-bottom: 1px solid var(--line);
    cursor: zoom-in;
    padding: 0;
    overflow: hidden;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top left;
    display: block;
  }

  .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }

  .filename {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
    line-height: 1.4;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .chip {
    background: #11141a;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .chip b {
    color: var(--text);
    font-family: var(--mono);
    font-weight: 600;
    margin-left: 5px;
  }

  .badge {
    align-self: flex-start;
    background: rgba(255, 92, 92, .12);
    border: 1px solid rgba(255, 92, 92, .45);
    border-radius: 6px;
    color: var(--danger);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
  }

  .selects { display: flex; gap: 8px; }

  select {
    flex: 1;
    min-width: 0;
    appearance: none;
    background: #11141a;
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 7px 9px;
    outline: none;
    cursor: pointer;
  }

  select:focus { border-color: var(--accent); }

  select.unset { color: var(--danger); border-color: rgba(255, 92, 92, .45); }

  .preview {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    word-break: break-all;
    color: var(--muted);
    border-top: 1px dashed var(--line);
    padding-top: 7px;
  }

  .preview .arrow { color: #5d6474; margin: 0 3px; }
  .preview .to { color: var(--danger); }
  .preview.ready .to { color: var(--ok); }

  .group { margin-bottom: 26px; }
  .group:last-child { margin-bottom: 0; }

  .group-head {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 0 2px 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  .group-title { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }

  .customer { font-size: 14px; font-weight: 600; }
  .customer.muted { color: var(--muted); font-weight: 500; }

  .machine { font-size: 12px; color: var(--text); }
  .group-key { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .group-side { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .machine-select { max-width: 230px; flex: none; }

  .group-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .group-count .picked { color: var(--ok); }
  .group-count .unpicked { color: #e0a44c; }

  .env-hint {
    display: flex;
    gap: 6px;
    font-size: 11px;
    line-height: 1.45;
    color: #e0a44c;
  }

  .env-hint::before { content: "●"; font-size: 8px; line-height: 2; }
  .env-hint[hidden] { display: none; }

  .empty {
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 40px;
    text-align: center;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 9, .92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    padding: 24px;
    cursor: zoom-out;
    z-index: 10;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 100%;
    max-height: calc(100vh - 90px);
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .6);
  }

  .lightbox .caption {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1>截图批量重命名</h1>
  <span class="subtitle">本机运行 · 不联网 · 原目录只读</span>
  <span class="count" id="count"></span>
</header>

<div class="pathbar">
  <input id="path" type="text" spellcheck="false" placeholder="粘贴截图目录，例如 C:\Shots 或 \\TCSR2\Shots（也可以把文件夹拖到 .bat 上）">
  <button id="scan">扫描</button>
</div>

<div class="targetbar">
  <input id="target" type="text" spellcheck="false" placeholder="落盘目录，默认 <源目录>\Renamed，可以改">
  <button id="apply" disabled>落盘</button>
</div>

<div class="hint" id="config-hint"></div>

<div class="status" id="status"></div>

<main>
  <div id="groups"></div>
  <div class="empty" id="empty">给一个截图目录，这里会把里面的 PNG 全列出来。</div>
</main>

<div class="lightbox" id="lightbox">
  <img id="lightbox-image" alt="">
  <div class="caption" id="lightbox-caption"></div>
</div>

<script>
  const pathInput = document.getElementById("path");
  const targetInput = document.getElementById("target");
  const scanButton = document.getElementById("scan");
  const applyButton = document.getElementById("apply");
  const statusLine = document.getElementById("status");
  const configHint = document.getElementById("config-hint");
  const groupsContainer = document.getElementById("groups");
  const empty = document.getElementById("empty");
  const countLine = document.getElementById("count");
  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightbox-image");
  const lightboxCaption = document.getElementById("lightbox-caption");

  const config = { envs: [], categories: [], undecided: "未定", template: "({env}){number}_{pcname}-{category}.png" };

  let currentDirectory = "";
  let currentCount = 0;
  let currentBad = 0;
  let records = [];
  let machines = [];
  let targetDirty = false;

  function setStatus(message, kind) {
    statusLine.textContent = message || "";
    statusLine.className = "status" + (kind ? " " + kind : "");
  }

  function imageUrl(directory, filename) {
    return "/api/image?directory=" + encodeURIComponent(directory) +
      "&filename=" + encodeURIComponent(filename);
  }

  function chip(label, value) {
    const span = document.createElement("span");
    span.className = "chip";
    span.textContent = label;
    const strong = document.createElement("b");
    strong.textContent = value;
    span.appendChild(strong);
    return span;
  }

  function option(value, label) {
    const element = document.createElement("option");
    element.value = value;
    element.textContent = label;
    return element;
  }

  // 组头选定的机器说了算：PCNAME 与数字一次带出；没选就用文件名解析出的。
  function effectiveIdentity(record) {
    const machine = record.group && record.group.machine;
    if (machine) return { pcname: machine.pcname, number: machine.number };
    return { pcname: record.image.pcname, number: record.image.number };
  }

  // 模板由服务端下发，页面不另抄一份命名规则；ENV 的写法也由服务端给的选项决定。
  function targetName(record) {
    const env = record.envSelect.value || "ENV";
    const category = record.categorySelect.value === config.undecided
      ? "类别"
      : record.categorySelect.value;
    const identity = effectiveIdentity(record);
    return config.template
      .replace("{env}", env)
      .replace("{number}", identity.number)
      .replace("{pcname}", identity.pcname)
      .replace("{category}", category);
  }

  function isReady(record) {
    return record.image.compliant &&
      record.envSelect.value !== "" &&
      record.categorySelect.value !== config.undecided;
  }

  function refresh(record) {
    const ready = isReady(record);
    const identity = effectiveIdentity(record);

    const from = document.createElement("span");
    from.className = "from";
    from.textContent = record.image.filename;
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "→";
    const to = document.createElement("span");
    to.className = "to";
    to.textContent = targetName(record);
    record.preview.replaceChildren(from, arrow, to);
    record.preview.className = "preview" + (ready ? " ready" : "");

    record.numberValue.textContent = identity.number;
    record.pcnameValue.textContent = identity.pcname;

    record.card.classList.toggle("ready", ready);
    record.card.classList.toggle("pending", !ready);
    record.envSelect.classList.toggle("unset", record.envSelect.value === "");
    record.categorySelect.classList.toggle("unset", record.categorySelect.value === config.undecided);

    updateGroupCount(record.group);
    updateCounts();
  }

  function updateGroupCount(group) {
    if (!group) return;

    if (!group.payload.pcname) {
      group.countEl.textContent = "不合规 " + group.payload.images.length + " 张";
      return;
    }

    const picked = group.records.filter((record) => record.envSelect.value !== "").length;
    const unpicked = group.records.length - picked;
    group.countEl.innerHTML =
      "ENV 已点 <b class='picked'>" + picked + "</b> · 未点 <b class='unpicked'>" + unpicked + "</b>";
  }

  function updateGroupHead(group) {
    const machine = group.machine;
    // 登记过的组被人手动改回「未登记」时，组头也得跟着说未登记。
    const cleared = !machine && group.payload.machine_index !== null;
    const customer = machine ? machine.customer : cleared ? "" : group.payload.customer;
    const label = machine ? machine.label : cleared ? "未登记" : group.payload.label;
    const identity = machine
      ? { pcname: machine.pcname, number: machine.number }
      : { pcname: group.payload.pcname, number: group.payload.number };

    // 没有顾客名时（未登记 / 不合规），组头只写那一个词，不重复。
    group.customerEl.textContent = customer || label || "未登记";
    group.customerEl.classList.toggle("muted", !machine);
    group.machineEl.textContent = customer && label ? "· " + label : "";
    group.keyEl.textContent = identity.pcname
      ? "PCNAME " + identity.pcname + " · 数字 " + identity.number
      : "";
    updateGroupCount(group);
  }

  function updateCounts() {
    const ready = records.filter(isReady).length;
    const pending = currentCount - currentBad - ready;
    const parts = ["本批 <b>" + currentCount + "</b> 张"];
    if (ready) parts.push("<span class='ok'>已确认 " + ready + "</span>");
    if (pending) parts.push("<span class='warn'>待点 " + pending + "</span>");
    if (currentBad) parts.push("<span class='warn'>" + currentBad + " 张不合规</span>");
    countLine.innerHTML = parts.join(" · ");
    applyButton.disabled = ready === 0;
  }

  function renderCard(image, directory, group) {
    const card = document.createElement("div");
    card.className = image.compliant ? "card" : "card invalid";

    const thumb = document.createElement("button");
    thumb.className = "thumb";
    thumb.title = "看大图";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = image.filename;
    img.src = imageUrl(directory, image.filename);
    thumb.appendChild(img);
    thumb.addEventListener("click", () => openLightbox(img.src, image.filename));
    card.appendChild(thumb);

    const meta = document.createElement("div");
    meta.className = "meta";

    if (!image.compliant) {
      const name = document.createElement("div");
      name.className = "filename";
      name.textContent = image.filename;
      meta.appendChild(name);

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "不合规 · 不参与落盘";
      meta.appendChild(badge);
      card.appendChild(meta);
      return { card, record: null };
    }

    const chips = document.createElement("div");
    chips.className = "chips";
    const numberChip = chip("数字", image.number);
    const pcnameChip = chip("PCNAME", image.pcname);
    chips.append(numberChip, pcnameChip, chip("时间", image.time_fragment));
    meta.appendChild(chips);

    const selects = document.createElement("div");
    selects.className = "selects";

    const categorySelect = document.createElement("select");
    categorySelect.title = "类别";
    categorySelect.appendChild(option(config.undecided, config.undecided));
    config.categories.forEach((category) => categorySelect.appendChild(option(category, category)));
    // 预判只是替人先填一格：判不出的留在「未定」，照样可以改。
    if (config.categories.includes(image.predicted_category)) {
      categorySelect.value = image.predicted_category;
      categorySelect.title = "类别 · OCR 预判为 " + image.predicted_category + "，不对就改";
    }
    if (image.ocr_text) {
      categorySelect.title += "\n\nOCR 读到的文字：\n" + image.ocr_text.slice(0, 600);
    }

    const envSelect = document.createElement("select");
    envSelect.title = "ENV";
    envSelect.appendChild(option("", "ENV 未选"));
    config.envs.forEach((env) => envSelect.appendChild(option(env, env)));

    selects.appendChild(categorySelect);
    selects.appendChild(envSelect);
    meta.appendChild(selects);

    // 线索只写在下拉旁边：ENV 仍然空着，点哪一格由人决定。
    const hint = document.createElement("div");
    hint.className = "env-hint";
    if (image.env_hint) {
      hint.textContent = image.env_hint;
    } else {
      hint.hidden = true;
    }
    meta.appendChild(hint);

    const preview = document.createElement("div");
    preview.className = "preview";
    meta.appendChild(preview);

    card.appendChild(meta);

    const record = {
      image,
      card,
      group,
      categorySelect,
      envSelect,
      preview,
      numberValue: numberChip.querySelector("b"),
      pcnameValue: pcnameChip.querySelector("b"),
    };
    categorySelect.addEventListener("change", () => refresh(record));
    envSelect.addEventListener("change", () => refresh(record));
    return { card, record };
  }

  function defaultMachineIndex(payload) {
    return payload.machine_index === null || payload.machine_index === undefined
      ? ""
      : String(payload.machine_index);
  }

  function renderGroup(payload, imagesByName, directory) {
    const section = document.createElement("section");
    section.className = "group";

    const head = document.createElement("div");
    head.className = "group-head";

    const title = document.createElement("div");
    title.className = "group-title";
    const customerEl = document.createElement("span");
    customerEl.className = "customer";
    const machineEl = document.createElement("span");
    machineEl.className = "machine";
    const keyEl = document.createElement("span");
    keyEl.className = "group-key";
    title.append(customerEl, machineEl, keyEl);
    head.appendChild(title);

    const side = document.createElement("div");
    side.className = "group-side";

    const group = {
      payload,
      machine: null,
      records: [],
      customerEl,
      machineEl,
      keyEl,
      countEl: document.createElement("span"),
    };
    group.countEl.className = "group-count";

    // 文件名不合规的那一组没有机器可选，也没有 ENV 要点。
    if (payload.pcname) {
      const select = document.createElement("select");
      select.className = "machine-select";
      select.title = "顾客 → 机器：选定后本组 PCNAME 与数字一次带出，ENV 仍然逐张点";
      select.appendChild(option("", "未登记（按文件名）"));

      let holder = select;
      machines.forEach((machine, index) => {
        if (holder === select || holder.label !== machine.customer) {
          holder = document.createElement("optgroup");
          holder.label = machine.customer;
          select.appendChild(holder);
        }
        holder.appendChild(option(String(index), machine.label + " · " + machine.pcname));
      });

      const defaultIndex = defaultMachineIndex(payload);
      if (defaultIndex !== "") {
        select.value = defaultIndex;
        group.machine = machines[Number(defaultIndex)];
      }

      select.addEventListener("change", () => {
        group.machine = select.value === "" ? null : machines[Number(select.value)];
        updateGroupHead(group);
        group.records.forEach(refresh);
      });

      side.appendChild(select);
    }

    side.appendChild(group.countEl);
    head.appendChild(side);
    section.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "grid";
    section.appendChild(grid);

    payload.images.forEach((filename) => {
      const image = imagesByName.get(filename);
      if (!image) return;
      const built = renderCard(image, directory, group);
      grid.appendChild(built.card);
      if (built.record) group.records.push(built.record);
    });

    updateGroupHead(group);
    return { section, group };
  }

  function render(payload) {
    currentDirectory = payload.directory;
    currentCount = payload.count;
    currentBad = payload.non_compliant_count;
    machines = payload.machines || [];
    records = [];
    groupsContainer.replaceChildren();

    const imagesByName = new Map(payload.images.map((image) => [image.filename, image]));
    (payload.groups || []).forEach((groupPayload) => {
      const built = renderGroup(groupPayload, imagesByName, payload.directory);
      groupsContainer.appendChild(built.section);
      built.group.records.forEach((record) => records.push(record));
    });

    records.forEach(refresh);

    if (!targetDirty) {
      targetInput.value = payload.default_target_directory || "";
    }
    empty.style.display = payload.count ? "none" : "block";
    if (!payload.count) {
      empty.textContent = "这个目录里没有 PNG。";
    }

    updateCounts();
  }

  async function scan() {
    const directory = pathInput.value.trim();
    if (!directory) {
      setStatus("先填一个截图目录。", "error");
      pathInput.focus();
      return;
    }

    scanButton.disabled = true;
    setStatus("正在扫描并识别…");
    try {
      const response = await fetch("/api/scan?directory=" + encodeURIComponent(directory));
      const payload = await response.json();
      if (!response.ok) {
        setStatus(payload.error || "扫描失败", "error");
        return;
      }
      render(payload);
      const predicted = payload.images.filter(
        (image) => image.compliant && image.predicted_category && image.predicted_category !== config.undecided
      ).length;
      const tail = predicted ? "，其中 " + predicted + " 张类别已预判，核对后点 ENV" : "";
      const groupCount = (payload.groups || []).length;
      const grouped = groupCount ? "，分 " + groupCount + " 组" : "";
      const summary = "已列出 " + payload.count + " 张" + grouped + tail + "：" + payload.directory;
      const note = payload.machine_warning || payload.ocr_warning;
      setStatus(note ? summary + "　" + note : summary, note ? "warn" : "");
    } catch (error) {
      setStatus("扫描失败：" + error.message, "error");
    } finally {
      scanButton.disabled = false;
    }
  }

  async function apply() {
    const decisions = records.map((record) => {
      const machine = record.group.machine;
      return {
        filename: record.image.filename,
        env: record.envSelect.value,
        category: record.categorySelect.value,
        pcname: machine ? machine.pcname : "",
        number: machine ? machine.number : "",
      };
    });

    applyButton.disabled = true;
    setStatus("正在落盘…");
    try {
      const response = await fetch("/api/rename", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          directory: currentDirectory,
          target_directory: targetInput.value.trim(),
          decisions,
        }),
      });
      const payload = await response.json();
      if (!response.ok) {
        setStatus(payload.error || "落盘失败", "error");
        return;
      }

      const parts = ["已落盘 " + payload.copied + " 张"];
      if (payload.conflicts) parts.push("冲突 " + payload.conflicts + " 张（目标已存在，没覆盖）");
      if (payload.failed) parts.push("失败 " + payload.failed + " 张");
      if (payload.blocked.length) parts.push("挡住 " + payload.blocked.length + " 张");
      const clean = payload.conflicts === 0 && payload.failed === 0;
      setStatus(
        parts.join(" · ") + " → " + payload.target_directory + "（日志 rename-log.csv）",
        clean ? "done" : "warn"
      );
    } catch (error) {
      setStatus("落盘失败：" + error.message, "error");
    } finally {
      updateCounts();
    }
  }

  function openLightbox(src, filename) {
    lightboxImage.src = src;
    lightboxImage.alt = filename;
    lightboxCaption.textContent = filename;
    lightbox.classList.add("open");
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImage.removeAttribute("src");
  }

  lightbox.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeLightbox();
  });

  scanButton.addEventListener("click", scan);
  applyButton.addEventListener("click", apply);
  targetInput.addEventListener("input", () => {
    targetDirty = true;
  });
  pathInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") scan();
  });

  (async function boot() {
    try {
      const response = await fetch("/api/config");
      const payload = await response.json();
      config.envs = payload.envs || [];
      config.categories = payload.categories || [];
      config.undecided = payload.undecided || "未定";
      machines = payload.machines || [];

      const hint = document.createElement("span");
      hint.append("ENV 选项与「顾客 → 机器」登记来自 ");
      const configPath = document.createElement("code");
      configPath.textContent = payload.config_path || "";
      hint.appendChild(configPath);
      hint.append("（已登记 " + machines.length + " 台机器；加一台就照着 ");
      const sample = document.createElement("code");
      sample.textContent = '{"name": "顾客", "machines": [{"pcname": "TCSB2", "number": "82331647"}]}';
      hint.appendChild(sample);
      hint.append(" 的样子加一条，刷新页面即生效）。");
      configHint.appendChild(hint);
      if (payload.warning) {
        setStatus(payload.warning, "error");
      } else if (payload.machine_warning) {
        setStatus(payload.machine_warning, "warn");
      }
    } catch (error) {
      setStatus("读不到 ENV 配置：" + error.message, "error");
    }

    try {
      const response = await fetch("/api/state");
      const payload = await response.json();
      const startDirectory = payload.initial_directory || payload.last_directory;
      if (startDirectory) {
        pathInput.value = startDirectory;
        scan();
      }
    } catch (error) {
      setStatus("读不到上次的目录，手动填一个即可。", "error");
    }
  })();
</script>
</body>
</html>
